name: qa-agent-ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: qa-agent-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Unit, planning, provider, cost and security tests (no servers)
        run: python -m pytest -q -m "not integration" --junitxml=reports/unit.xml
      - name: Integration tests (real Chromium vs synthetic SUT, local model stub on 127.0.0.1)
        if: always()
        run: python -m pytest -q -m integration --junitxml=reports/integration.xml
      - name: Category coverage check (each category has tests)
        if: always()
        run: |
          for m in provider planning approval execution audit cost security; do
            n=$(python -m pytest -q --collect-only -m "$m" | grep -c "::" || true)
            echo "$m: $n tests" | tee -a "$GITHUB_STEP_SUMMARY"
            test "$n" -gt 0
          done
      - name: Smoke demo (headless UI, replay model)
        if: always()
        run: python scripts/demo_and_screenshots.py
      - name: Test summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          print("## QA agent test results\n\n| suite | tests | failures | errors | skipped |\n|---|---|---|---|---|")
          for f in sorted(glob.glob("reports/*.xml")):
              s = ET.parse(f).getroot()
              s = s if s.tag == "testsuite" else s.find("testsuite")
              print(f"| {f} | {s.get('tests')} | {s.get('failures')} | {s.get('errors')} | {s.get('skipped')} |")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-reports
          path: |
            reports/
            data/runs/*/report.*
          retention-days: 14
