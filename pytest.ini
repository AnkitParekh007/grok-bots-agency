[pytest]
testpaths = tests
markers =
    provider: model provider behaviour (transport, retries, errors, egress)
    planning: model-output contracts and validation
    approval: human approval, identity, ownership, expiry
    execution: Playwright/API execution, comparison, cancellation, timeouts
    audit: audit chain, sequence, export
    cost: usage, pricing, budgets
    security: policy, secrets, injection, authz
    integration: starts local servers (SUT / model stub) and/or real Chromium
